name: native_opencv_kit
description: >-
  A Flutter FFI plugin that wraps OpenCV for Android and iOS. Provides
  real-time blur detection and ID-card cropping using native C++ via dart:ffi.
version: 1.0.1
homepage: https://github.com/socheatcheng/native_opencv_kit
repository: https://github.com/socheatcheng/native_opencv_kit
issue_tracker: https://github.com/socheatcheng/native_opencv_kit/issues

topics:
  - opencv
  - image-processing
  - ffi
  - blur-detection
  - id-card

environment:
  sdk: ^3.7.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ffi: ^2.2.0
  camera: ^0.11.0
  http: ^1.2.0
  photo_manager: ^3.12.0
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.native_opencv
        pluginClass: NativeOpencvPlugin
      ios:
        pluginClass: NativeOpencvPlugin
