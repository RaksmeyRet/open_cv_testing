name: id_scanner
description: "A reusable Flutter package for scanning Cambodian ID cards using OpenCV, ML Kit, and Tesseract OCR."
version: 0.0.1
homepage:

environment:
  sdk: ^3.7.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

  # OpenCV FFI plugin (the parent package in this monorepo)
  native_opencv_kit:
    path: ../

  # Core dependencies
  ffi: ^2.2.0
  plugin_platform_interface: ^2.0.2

  # Camera & media
  camera: ^0.11.2+1
  image_picker: ^1.2.1
  photo_manager: ^3.12.0

  # Image processing
  image: ^4.8.0

  # State management
  get: ^4.7.3

  # File system
  path_provider: ^2.1.1

  # OCR
  google_mlkit_text_recognition: ^0.15.0
  tesseract_ocr: ^0.5.0

  # Permissions
  permission_handler: ^12.0.3

  # Sensors (optional – used by example but kept for full feature parity)
  sensors_plus: ^6.1.1

  # Networking (kept in case callers want to forward OCR results to an API)
  http: ^1.6.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/id_card.png
    - assets/tessdata_config.json
    - assets/tessdata/
